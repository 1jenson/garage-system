<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workshop · Wents Service Station</title>
<meta name="description" content="Clickable mock of the new garage system: lookup, diary, quotes, invoices, suppliers, cancellation list. Demo data only.">
<meta name="theme-color" content="#173E70">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>/* iOS paints transparent icons black, so the Home Screen icon carries a tile: dark by default, white when the phone is in light mode. */
if(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches){document.querySelector('link[rel="apple-touch-icon"]').href="icons/apple-touch-icon-light.png";}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workshop">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Saira:wght@800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#121316; --surface:#1C1D21; --sunk:#25272C; --fg:#ECEDEF; --muted:#A6A9B0; --line:#303238; --line-strong:#464950;
  --band:#173E70; --band-fg:#FFFFFF; --band-muted:#C6D5EB; --band-line:#2F5D96;
  --accent:#6AA6F0; --accent-fg:#0B1424; --ring:#CFE2FB; --warn:#F2B705;
  --flag-bg:#3A2F0E; --flag-line:#9C7A12; --flag-fg:#F5D77A;
  --tile:#2A2C32; --tile-hover:#34373E;
  --green:#5CB85C; --green-fg:#06220B; --red:#E5484D; --orange:#F28C28;
  --plate:#F5D000; --plate-fg:#111; --plate-band:#1F3E9B;
  --font-display:'Archivo',system-ui,-apple-system,sans-serif;
  --font-title:'Saira','Archivo',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-display);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:
 radial-gradient(900px 500px at 85% -10%, rgba(92,184,92,.10), transparent 60%),
 radial-gradient(700px 500px at -10% 110%, rgba(229,72,77,.08), transparent 60%);z-index:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:800}
.app{position:relative;z-index:1;display:grid;grid-template-columns:196px 1fr;min-height:100dvh}
.app>*,.two>*{min-width:0}
body{overflow-x:hidden}

/* sidebar */
.side{position:sticky;top:0;height:100dvh;padding:16px 10px;border-right:1px solid var(--line);background:rgba(18,19,22,.9);display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand .mark{width:36px;height:36px;display:grid;place-items:center}
.brand .mark svg{width:36px;height:36px;display:block}
.brand b{display:block;font-family:var(--font-title);font-size:16px;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
.nav a{display:flex;align-items:center;gap:11px;padding:7px 10px;border-radius:10px;color:var(--muted);font-weight:600;font-size:14px}
.nav a svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{background:var(--tile);color:var(--fg)}
.nav a.on{background:var(--tile);color:var(--fg)}
.nav a.on svg{color:var(--green)}
.nav .count{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px}
.side .foot{margin-top:auto;padding:12px 10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)} .side .foot .ver{font-family:var(--font-mono);font-size:11px;letter-spacing:.04em;opacity:.8}
.side .foot .dot{display:inline-block;width:7px;height:7px;border-radius:99px;background:var(--green);margin:0 6px 1px 0;box-shadow:0 0 0 3px rgba(92,184,92,.2)} .side .foot .dot.old{background:#FFB300;box-shadow:0 0 0 3px rgba(255,179,0,.2)} .side .foot .dot.bad{background:var(--red);box-shadow:0 0 0 3px rgba(229,72,77,.2)} .side .foot a.bkup{color:var(--muted);text-decoration:none;white-space:nowrap;letter-spacing:0} .side .foot a.bkup:hover{color:var(--fg)}

/* main */
.main{min-width:0;padding:26px 24px 90px;max-width:1480px;width:100%}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.title{font-family:var(--font-title);font-size:34px;line-height:1.05;letter-spacing:-.01em;margin:2px 0 20px}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head .actions{display:flex;gap:8px;flex-wrap:wrap}
.head .actions.ctr,.row.ctr{flex:1 1 100%;width:100%;justify-content:center;gap:10px}
.head.ctrh{gap:10px;margin-bottom:10px}.head.ctrh .title{margin-bottom:0}
.sec{font-size:18px;font-weight:800;margin:26px 0 12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.card.pad0{padding:0;overflow:hidden}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:block;transition:background .15s,border-color .15s}
.tile:hover{background:var(--tile-hover);border-color:var(--line-strong)}
.tile .ic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;margin-bottom:28px;background:var(--tile)}
.tile .ic svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile b{display:block;font-size:19px;font-weight:800;margin-bottom:2px}
.tile span{color:var(--muted)}
.ic.yel{background:var(--flag-bg);color:var(--flag-fg)} .ic.red{background:#3A1416;color:#F08A8E} .ic.blu{background:#17304F;color:var(--accent)} .ic.grn{background:#153A1C;color:#7ED37E} .ic.org{background:#3B250D;color:#F6B26B}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.stat b{display:block;font-family:var(--font-mono);font-size:30px;font-weight:600;line-height:1}
.stat span{color:var(--muted);font-size:14px}
.stat.y b{color:var(--warn)} .stat.b b{color:var(--accent)} .stat.r b{color:#F26469} .stat.g b{color:#7ED37E}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:12px;font-weight:700;background:var(--tile);border:1px solid var(--line);white-space:nowrap}
.btn:hover{background:var(--tile-hover)}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.pri{background:var(--green);color:var(--green-fg);border-color:transparent;box-shadow:0 0 0 4px rgba(92,184,92,.15)}
.btn.pri:hover{background:#68c468}
.btn.yel{background:var(--warn);color:#1a1400;border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.wide{width:100%;justify-content:center;padding:15px;font-size:17px;border-radius:14px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12.5px;font-weight:700;background:var(--tile);color:var(--muted)}
.pill.y{background:var(--flag-bg);color:var(--flag-fg)} .pill.g{background:#153A1C;color:#7ED37E} .pill.r{background:#3A1416;color:#F08A8E} .pill.b{background:#17304F;color:var(--accent)} .pill.o{background:#3B250D;color:#F6B26B}
.pill i{width:7px;height:7px;border-radius:99px;background:currentColor;font-style:normal}
.plate{display:inline-flex;align-items:stretch;border-radius:6px;overflow:hidden;font-family:var(--font-title);font-weight:800;letter-spacing:.04em;font-size:19px;line-height:1;font-style:normal;background:var(--plate);color:var(--plate-fg);flex:none}
.plate::before{content:"UK";display:grid;place-items:center;background:var(--plate-band);color:#fff;font-size:8px;padding:0 5px;font-style:normal;letter-spacing:0}
.plate span{padding:7px 10px 6px 8px;white-space:nowrap}
/* plate house rule (round 44): one plate, three sizes, no per-area size overrides. .plate 19px record headers; .md 16px Ready to go out and courtesy page cards; .sm 13px every list row */
.plate.md{font-size:16px} .plate.md span{padding:5px 8px 4px 7px} .plate.md::before{font-size:7px;padding:0 4px}
.plate.sm{font-size:13px} .plate.sm span{padding:4px 7px 3px 6px} .plate.sm::before{font-size:6.5px;padding:0 3.5px}
.mono{font-family:var(--font-mono);font-weight:500}
.muted{color:var(--muted)}
.small{font-size:13px}
.list{display:flex;flex-direction:column}
.list .it{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--line);transition:background .12s}
.list .it:first-child{border-top:0}
.list a.it:hover{background:var(--tile)}
.list .it .t{flex:1;min-width:0}
.list .it .t b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .it .t span{color:var(--muted);font-size:13px}
.list .it .amt{font-family:var(--font-mono);font-weight:600;font-size:16px}
.chev{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
.av{width:38px;height:38px;border-radius:99px;display:grid;place-items:center;font-weight:800;flex:none;background:var(--tile)}
.av.adam{background:#E5636B;color:#fff} .av.karen{background:#F06FA8;color:#1a0010} .av.jen{background:#6AA6F0;color:#0B1424}
.search{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line-strong);border-radius:18px;padding:6px 8px 6px 18px}
.search svg{width:24px;height:24px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
.search input{flex:1;background:none;border:0;outline:0;font-size:20px;padding:12px 0;min-width:0}
.search input::placeholder{color:#6c7079}
.search .btn{padding:12px 18px}
.search:focus-within{box-shadow:0 0 0 4px rgba(106,166,240,.18);border-color:var(--accent)}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600} .bk .mid.link{cursor:pointer}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field input,.field select,.field textarea{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:0;font-size:16px}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(106,166,240,.18)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:10px 14px;padding:4px 0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;text-align:right}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{padding:9px 16px;border-radius:99px;background:var(--tile);color:var(--muted);font-weight:700;border:1px solid transparent}
.tabs button.on{background:var(--fg);color:var(--bg)}
.table{width:100%;border-collapse:collapse}
.table th{text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 16px;border-bottom:1px solid var(--line)}
.table td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table tr.link{cursor:pointer} .table tr.link:hover td{background:var(--tile)}
.table .r{text-align:right}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;opacity:0;transition:.25s;z-index:50;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translateX(-50%)}
.demo{position:fixed;right:-2px;top:46%;background:var(--warn);color:#1a1400;font-weight:800;font-size:12px;letter-spacing:.2em;writing-mode:vertical-rl;padding:16px 8px;border-radius:10px 0 0 10px;z-index:40}

/* diary */
.week{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.week button{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;color:var(--muted)}
.week button b{display:block;font-family:var(--font-mono);font-size:24px;color:var(--fg);font-weight:600;margin:2px 0}
.week button.on{background:var(--warn);color:#4a3a00;border-color:transparent} .week button.on b{color:#1a1400}
.bays{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.bay h3{font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 4px 10px}
.job{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px 18px;margin-bottom:10px;display:block;overflow:hidden}
.job::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--who)}
.job .time{font-family:var(--font-mono);font-size:13px;color:var(--muted)}
.job .time b{color:var(--fg);font-weight:600;font-style:italic}
.job h4{margin:8px 0 2px;font-size:17px}
.job p{margin:0;color:var(--muted);font-size:13.5px}
.job .ft{display:flex;align-items:center;justify-content:space-between;margin-top:12px;color:var(--muted);font-size:13px}
.job:hover{background:var(--tile)}
.slot{border:1px dashed var(--line-strong);border-radius:14px;padding:12px;text-align:center;color:var(--muted);font-size:13px;margin-bottom:10px}
.slot:hover{border-color:var(--accent);color:var(--accent)}

/* quote editor */
.line{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.line .lh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.line .lh b{font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.line .lh b.lab{color:var(--accent)} .line .lh b.prt{color:var(--flag-fg)} .line .lh b.mot{color:#7ED37E}
.line .x{width:30px;height:30px;border-radius:9px;background:var(--tile);display:grid;place-items:center;color:var(--muted)}
.line input,.line textarea{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:0;font-size:15px;width:100%} .line textarea{resize:vertical;min-height:62px;line-height:1.45;font-family:inherit}
.line .nums{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;margin-top:8px;align-items:end}
.line .nums label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.line .tot{font-family:var(--font-mono);font-weight:600;font-size:17px;font-style:italic;padding-bottom:10px;min-width:80px;text-align:right}
.totals{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.totals div{display:flex;justify-content:space-between;padding:6px 0;font-size:15px}
.totals div span:last-child{font-family:var(--font-mono);font-style:italic;font-weight:600}
.totals .grand{border-top:1px solid var(--line-strong);margin-top:6px;padding-top:12px;font-size:20px;font-weight:800}
.two{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}

/* invoice paper */
.paper{background:#fff;color:#111;border-radius:16px;padding:28px 30px;font-size:14px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.paper .ph{display:flex;justify-content:space-between;gap:16px;border-bottom:3px solid #111;padding-bottom:16px}
.paper .logo{width:52px;height:52px;border-radius:99px;background:#2F6DC8;color:#fff;display:grid;place-items:center;font-family:var(--font-title);font-size:26px}
.paper .ph b{font-size:17px}
.paper .ph .inv{text-align:right;font-weight:800;font-size:22px;letter-spacing:.02em}
.paper .ph .inv i{display:block;font-size:14px;font-weight:700}
.paper .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#666;font-weight:700}
.paper .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:16px 0;border-bottom:1px solid #ddd}
.paper .meta b{display:block;font-size:15px}
.paper table{width:100%;border-collapse:collapse;margin-top:14px}
.paper th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#666;text-align:left;padding:8px 0;border-bottom:2px solid #111}
.paper td{padding:10px 0;border-bottom:1px solid #e5e5e5;vertical-align:top}
.paper td.r,.paper th.r{text-align:right;white-space:nowrap}
.paper td small{display:block;color:#777;font-size:12px}
.paper .grp td{padding:14px 0 4px;border:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:#2F6DC8}
.paper .sum{margin:14px 0 0 auto;width:min(100%,300px)}
.paper .sum div{display:flex;justify-content:space-between;padding:5px 0}
.paper .sum div span:last-child{font-style:italic;font-weight:700}
.paper .sum .g{border-top:2px solid #111;margin-top:6px;padding-top:10px;font-size:18px;font-weight:800}
.paper .note{background:#F3F4F6;border-radius:10px;padding:12px 14px;margin-top:16px}
.paper .bank{border:2px dashed #ccc;border-radius:10px;padding:12px 14px;margin-top:12px}
.paper .fine{text-align:center;color:#777;font-size:12px;margin-top:16px}
.stamp{position:absolute;right:28px;top:120px;border:4px solid #2e9b4a;color:#2e9b4a;font-family:var(--font-title);font-size:34px;padding:4px 14px;border-radius:10px;transform:rotate(-12deg);opacity:.9}

/* mobile tab bar */
.tabbar{display:none}
.topbar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:18px 16px 110px}
  .title{font-size:28px}
  .g3,.g4{grid-template-columns:repeat(2,1fr)}
  .two{grid-template-columns:1fr}
  .bays{grid-template-columns:1fr}
  .week{grid-template-columns:repeat(6,1fr)}
  .week button b{font-size:20px}
  .search input{font-size:17px}
  .search .btn span{display:none}
  .kv{grid-template-columns:90px 1fr}
  .paper{padding:20px 18px}
  .paper .meta{grid-template-columns:1fr 1fr}
  .line .nums{grid-template-columns:1fr 1fr 1fr}
  .line .tot{grid-column:1/-1;text-align:right;padding:4px 0 0}
  .hide-m{display:none !important}
  .list .it{flex-wrap:wrap;row-gap:6px}
  .list .it .t{flex:1 1 100%;order:9}
  .list .it .t b{white-space:normal}
  .list .it .pill{margin-left:auto}
  .list .it .chev{display:none}
  .week button{padding:10px 2px;font-size:11px;white-space:nowrap}
  .paper .ph{flex-wrap:wrap}
  .paper .ph .inv{text-align:left}
  .head .actions .btn{padding:9px 12px;font-size:14px}
  .eyebrow{letter-spacing:.08em}
  .table th:nth-child(3),.table td:nth-child(3){display:none}
  .cantbl th:nth-child(3),.cantbl td:nth-child(3){display:table-cell}
  .edln{display:grid;grid-template-columns:46px 1fr 1fr 36px;flex-wrap:wrap} .edln .in.d{grid-column:2/4;min-width:0} .edln .in.q,.edln .in.p{width:auto!important;min-width:0} .edln .btn{grid-column:4;grid-row:1/3;align-self:center;justify-self:end}
  .cantbl th,.cantbl td{padding:10px 8px;font-size:13px} .cantbl th:first-child,.cantbl td:first-child{padding-left:14px} .cantbl .pill{padding:3px 7px;font-size:11px}
  .tabbar{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;align-items:flex-end;background:rgba(28,29,33,.92);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:28px;padding:10px 6px 8px;z-index:30}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:11px;font-weight:600;width:60px;position:relative}
  .tabbar a svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tabbar a.on{color:var(--green)}

<script>
// ---- Live data (Supabase) ---------------------------------------------------
// Anyone without a sign-in sees the demo exactly as before.  A staff sign-in
// (More → Sign in) refills the arrays above from the workshop's own Supabase
// project and writes edits back.  Server side: backend/supabase/README.md.
// The local real-data build (tools/garagebase/serve.py) keeps its file data.
(function(){
const WS_URL='';   // https://<ref>.supabase.co  — filled in once the project exists
const WS_ANON='';  // publishable (anon) key; row-level security means it reads nothing on its own
if(!/^https:\/\//.test(WS_URL)||!WS_ANON)return;
if(document.documentElement.classList.contains('local-loading')||window.__localData)return;
const LS='ws.session',YEARS=(v=>v==='all'?100:(+v||2))(new URLSearchParams(location.search).get('years')||localStorage.getItem('ws.years')||'2');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const J=o=>JSON.stringify(o);
const num=(s,pre)=>{const n=parseInt(String(s||'').replace(pre,''),10);return isNaN(n)?null:n};
const rest=(o,drop)=>{const r={};Object.keys(o).forEach(k=>{if(!drop.includes(k)&&o[k]!==undefined)r[k]=o[k]});return r};
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fixD=d=>(d===TD||d===NTD)?todayISO():d; // the demo's fixed "today" → the real date
const dow=d=>(new Date(d+'T12:00:00').getDay()+6)%7;
const weekday=d=>{const w=dow(d);return w>4?addD(d,7-w):d}; // closed Sat/Sun

// ---- session -------------------------------------------------------------
let sess=null;try{sess=JSON.parse(localStorage.getItem(LS)||'null')}catch(e){}
if(sess&&!(sess.access_token&&sess.refresh_token))sess=null;
const saveSess=s=>{sess=s;try{if(s)localStorage.setItem(LS,J(s));else localStorage.removeItem(LS)}catch(e){}};
const setSess=j=>saveSess({access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),email:(j.user&&j.user.email)||(sess&&sess.email)||''});
async function auth(path,body,bearer){const h={apikey:WS_ANON,'Content-Type':'application/json'};if(bearer)h.Authorization='Bearer '+bearer;
  const r=await fetch(WS_URL+'/auth/v1/'+path,{method:'POST',headers:h,body:J(body||{})});const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(j.msg||j.error_description||j.message||j.error||('Sign-in failed ('+r.status+')'));e.status=r.status;throw e}return j}
let refreshing=null;
const refresh=()=>{if(!refreshing)refreshing=auth('token?grant_type=refresh_token',{refresh_token:sess.refresh_token}).then(j=>{setSess(j);return sess}).finally(()=>{refreshing=null});return refreshing};
async function api(path,opt){opt=opt||{};if(!sess)throw Object.assign(new Error('signed out'),{status:401});
  if(sess.expires_at-Date.now()/1000<60){try{await refresh()}catch(e){if(e.status&&e.status<500){signOut('Your sign-in has expired');}throw e}}
  const h=Object.assign({apikey:WS_ANON,Authorization:'Bearer '+sess.access_token,'Content-Type':'application/json'},opt.headers||{});
  const init=()=>({method:opt.method||'GET',headers:h,body:opt.body!==undefined?J(opt.body):undefined});
  let r=await fetch(WS_URL+'/rest/v1/'+path,init());
  if(r.status===401){try{await refresh()}catch(e){if(e.status&&e.status<500)signOut('Your sign-in has expired');throw e}h.Authorization='Bearer '+sess.access_token;r=await fetch(WS_URL+'/rest/v1/'+path,init())}
  if(!r.ok){let m='';try{const j=await r.json();m=j.message||j.hint||j.details||''}catch(e){}const e=new Error(m||('HTTP '+r.status));e.status=r.status;throw e}
  const t=await r.text();return t?JSON.parse(t):null}
const rpc=(fn,args)=>api('rpc/'+fn,{method:'POST',body:args||{}});
const upsert=(table,key,rows)=>api(table+'?on_conflict='+key,{method:'POST',headers:{Prefer:'return=minimal,resolution=merge-duplicates'},body:rows});

// ---- cache (IndexedDB, cleared on sign-out) ------------------------------
const idb={open(){return new Promise((ok,no)=>{const q=indexedDB.open('ws-live',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})},
  async get(k){try{const db=await this.open();return await new Promise((ok,no)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}catch(e){return undefined}},
  async set(k,v){try{const db=await this.open();await new Promise((ok,no)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=ok;tx.onerror=()=>no(tx.error)})}catch(e){console.warn('ws: cache not saved',e&&e.message)}},
  clear(){return new Promise(ok=>{try{const q=indexedDB.deleteDatabase('ws-live');q.onsuccess=q.onerror=q.onblocked=()=>ok()}catch(e){ok()}})}};

// ---- state ----------------------------------------------------------------
let live=false,me=null,D=null,applied=false,stubs=[];
const status=m=>{const el=document.getElementById('ws-status');if(el)el.textContent=m||(me?'Signed in as '+(me.name||sess.email):'')};
const foot=()=>{const f=document.querySelector('aside .foot');if(f&&live)f.innerHTML='<span class="dot"></span>Live · Wents Workshop<br><span class="muted" id="ws-status"></span>';status()};
function signOut(msg){const s=sess;saveSess(null);pending.length=0;try{sessionStorage.setItem('ws.msg',msg||'Signed out')}catch(e){}
  const done=()=>{location.hash='#/home';location.reload()};
  Promise.all([idb.clear(),s?auth('logout',{},s.access_token).catch(()=>{}):null]).then(done,done)}
window.wsSignOut=()=>{if(pending.length&&!confirm('Some changes are still saving. Sign out anyway?'))return;signOut('Signed out')};

// ---- load ------------------------------------------------------------------
const CK='snap:'+YEARS;
async function load(){
  const cached=await idb.get(CK);
  if(cached&&cached.D&&cached.email===sess.email){D=cached.D;apply();
    try{const d=await rpc('ws_snapshot',{p_years:YEARS,p_since:D.meta.at});merge(d);await idb.set(CK,{D,email:sess.email});apply()}
    catch(e){console.warn('ws: delta sync failed',e.message);status('Offline · showing saved data')}
    return}
  try{D=await rpc('ws_snapshot',{p_years:YEARS})}
  catch(e){hideLoading();if(e.status===403||/not staff/i.test(e.message)){signOut('That email is not on the staff list. Ask Jenson to add it.');return}
    toast('Could not load live data: '+e.message);console.warn('ws: load failed',e);status('Could not load live data');return}
  await idb.set(CK,{D,email:sess.email});apply()}
function merge(d){
  const byKey=(arr,src,key,front)=>{const ix={};arr.forEach((x,i)=>ix[x[key]]=i);(src||[]).forEach(x=>{const i=ix[x[key]];if(i===undefined){front?arr.unshift(x):arr.push(x)}else arr[i]=x})};
  byKey(D.customers,d.customers,'id');Object.assign(D.CX,d.CX||{});byKey(D.vehicles,d.vehicles,'reg');Object.assign(D.VX,d.VX||{});
  byKey(D.invoices,d.invoices,'n',true);byKey(D.QUOTES,d.QUOTES,'id',true);byKey(D.JOBS,d.JOBS,'id',true);byKey(D.REMS,d.REMS,'id');
  const gone={};Object.keys(d.BK||{}).forEach(k=>(d.BK[k]||[]).forEach(b=>gone[b.id]=1));(d.BKdeleted||[]).forEach(id=>gone[id]=1);
  Object.keys(D.BK).forEach(k=>{D.BK[k]=D.BK[k].filter(b=>!gone[b.id]);if(!D.BK[k].length)delete D.BK[k]});
  Object.keys(d.BK||{}).forEach(k=>{D.BK[k]=(D.BK[k]||[]).concat(d.BK[k]);D.BK[k].sort((p,q)=>(p.t||'')<(q.t||'')?-1:(p.t||'')>(q.t||'')?1:0)});
  Object.assign(D.NOTES,d.NOTES||{});Object.assign(D.settings,d.settings||{});if(d.meta)D.meta=d.meta}

// ---- put the data where the pages read it (same as tools/garagebase/apply.js) ----
function apply(){
  const fillArr=(a,src)=>{a.length=0;(src||[]).forEach(x=>a.push(x))};const fillObj=(o,src)=>{Object.keys(o).forEach(k=>delete o[k]);Object.assign(o,src||{})};
  const tryDo=(l,fn)=>{try{fn()}catch(e){console.warn('ws: '+l+' skipped: '+e.message)}};
  if(!applied){const demo={};tryDo('demo regs',()=>{vehicles.forEach(v=>demo[v.reg]=1);Object.keys(legacy).forEach(r=>demo[r]=1);JOBS.forEach(j=>demo[j.r]=1);QUOTES.forEach(q=>demo[q.r]=1);WL.forEach(w=>{if(w.reg)demo[w.reg]=1});Object.keys(BK).forEach(d=>BK[d].forEach(b=>{if(b.reg)demo[b.reg]=1}));Object.keys(TY).forEach(d=>TY[d].forEach(b=>{if(b.reg)demo[b.reg]=1}))});
    stubs=Object.keys(demo).filter(r=>r&&!D.vehicles.some(v=>v.reg===r)).map(r=>({reg:r,make:'(demo slot, no real vehicle)',year:'',cust:'',miles:0,mot:'',fuel:'',colour:''}))}
  tryDo('customers',()=>fillArr(customers,D.customers));tryDo('CX',()=>fillObj(CX,D.CX));tryDo('vehicles',()=>fillArr(vehicles,D.vehicles));tryDo('VX',()=>fillObj(VX,D.VX));
  tryDo('invoices',()=>fillArr(invoices,D.invoices));tryDo('legacy',()=>fillObj(legacy,D.legacy));tryDo('QUOTES',()=>fillArr(QUOTES,D.QUOTES));tryDo('JOBS',()=>fillArr(JOBS,D.JOBS));tryDo('REMS',()=>fillArr(REMS,D.REMS));
  tryDo('owed',()=>fillArr(owed,invoices.filter(i=>i.status==='owed')));tryDo('dueSoon',()=>fillArr(dueSoon,vehicles.filter(v=>v.mot&&daysTo(v.mot)<=30)));
  tryDo('BK',()=>fillObj(BK,D.BK));tryDo('NOTES',()=>fillObj(NOTES,D.NOTES));
  ['PROMISE','SVC','TY','CFSEED'].forEach(k=>tryDo(k,()=>fillObj(window[k]||eval(k),{})));
  ['dropgo','ringbacks','XPAYS','WL','AUD'].forEach(k=>tryDo(k,()=>fillArr(eval(k),[])));
  if(!applied){
    tryDo('wrap screens',()=>Object.keys(S).forEach(k=>{const orig=S[k];if(typeof orig!=='function')return;S[k]=function(){const n=vehicles.length;stubs.forEach(v=>vehicles.push(v));try{return orig.apply(this,arguments)}finally{vehicles.length=n}}}));
    const ROWS=1000;tryDo('invoice list cap',()=>{const orig=window.invTable;window.invTable=function(){if((invQ||'').trim()||invF!=='all'||invoices.length<=ROWS)return orig.apply(this,arguments);const all=invoices.slice();const keep=all.slice().sort((a,b)=>b.n.localeCompare(a.n)).slice(0,ROWS);fillArr(invoices,keep);
      try{return orig.apply(this,arguments).replace('</tbody>','<tr><td colspan="6" class="muted small">Showing the newest '+ROWS.toLocaleString()+' of '+all.length.toLocaleString()+' invoices in view. Type a number, name or reg to search all of them.</td></tr></tbody>')}finally{fillArr(invoices,all)}}});
    tryDo('today',()=>{TODAY.setTime(Date.now());day=weekday(todayISO())});
    tryDo('staff',()=>((D.meta||{}).staff||[]).forEach(s=>{if(s.who&&!WHO[s.who])WHO[s.who]={n:s.name||s.initials||s.who,c:'#8A94A6'}}));
  }
  me=((D.meta||{}).staff||[]).find(s=>(s.email||'').toLowerCase()===(sess.email||'').toLowerCase())||me||{name:sess.email};
  applied=true;live=true;document.body.classList.add('ws-live');
  seedShadow();hideLoading();foot();
  tryDo('render',()=>go());
  const m=D.meta||{};console.log('ws: live data applied',{invoices:m.invoicesFull,legacy:m.invoicesLegacy,customers:m.customers,vehicles:m.vehicles,next:m.nextInvoice,since:m.since||null})}

// ---- writes ------------------------------------------------------------------
// Every record the user has looked at is shadowed as JSON; after each render
// any shadowed record that changed is queued and sent (one request per record,
// coalesced).  Bookings and day notes are diffed whole, they are small.
const shadow=new Map(),watched=new Map(),pending=[];let flushing=false,retryT=null;
const keyOf=c=>c.k+':'+(c.reg||c.id||c.day||(c.ref&&(c.ref.n||c.ref.id))||'');
function watch(k,ref,extra){if(!ref)return;const c=Object.assign({k,ref},extra||{});const key=keyOf(c);if(!watched.has(key)){watched.set(key,c);shadow.set(key,J(ref))}return c}
function mark(k,ref,extra){const c=Object.assign({k,ref},extra||{});if(!pending.some(p=>p.k===c.k&&(c.ref?p.ref===c.ref:(p.id===c.id&&p.day===c.day&&p.reg===c.reg))))pending.push(c);status('Saving…');setTimeout(flush,0)}
function touch(k,ref,extra){const c=watch(k,ref,extra);if(c)shadow.set(keyOf(c),J(ref));mark(k,ref,extra)}
function seedShadow(){Object.keys(BK).forEach(d=>(BK[d]||[]).forEach(b=>shadow.set('bk:'+b.id,J([d,b]))));Object.keys(NOTES).forEach(d=>shadow.set('note:'+d,J(NOTES[d])));
  watched.forEach(c=>shadow.set(keyOf(c),J(c.ref)))}
function checkAll(){
  watched.forEach((c,key)=>{const s=J(c.ref);if(shadow.get(key)!==s){shadow.set(key,s);mark(c.k,c.ref,c.reg?{reg:c.reg}:null)}});
  const seen={};Object.keys(BK).forEach(d=>(BK[d]||[]).forEach(b=>{seen[b.id]=1;const s=J([d,b]);if(shadow.get('bk:'+b.id)!==s){shadow.set('bk:'+b.id,s);mark('bk',null,{id:b.id})}}));
  Array.from(shadow.keys()).forEach(k=>{if(k.startsWith('bk:')&&!seen[k.slice(3)]){shadow.delete(k);mark('bk',null,{id:k.slice(3),del:true})}});
  Object.keys(NOTES).forEach(d=>{const s=J(NOTES[d]);if(shadow.get('note:'+d)!==s){shadow.set('note:'+d,s);mark('note',null,{day:d})}});
  Array.from(shadow.keys()).forEach(k=>{if(k.startsWith('note:')&&!NOTES[k.slice(5)]&&shadow.get(k)!=='[]'){shadow.set(k,'[]');mark('note',null,{day:k.slice(5)})}})}
function current(){const h=(location.hash||'#/home').slice(2).split('?')[0];const [r,...more]=h.split('/');const id=decodeURIComponent(more.join('/'));
  if(r==='invoice')watch('inv',invoices.find(x=>x.n===id));
  else if(r==='quote'&&id!=='new')watch('quote',QUOTES.find(x=>x.id===id));
  else if(r==='job')watch('job',JOBS.find(x=>x.id===id));
  else if(r==='vehicle'&&id&&VX[id])watch('veh',VX[id],{reg:id})}
async function flush(){if(flushing||!live)return;flushing=true;clearTimeout(retryT);
  try{while(pending.length){const p=pending[0];
      try{await send(p);pending.shift()}
      catch(e){if(e.status&&e.status<500&&![401,408,429].includes(e.status)){pending.shift();console.error('ws: not saved',p.k,e.message);toast('Not saved: '+e.message)}
        else{console.warn('ws: will retry',e.message);status('Offline · '+pending.length+' change'+(pending.length>1?'s':'')+' waiting');retryT=setTimeout(flush,15000);return}}}
    status('Saved · '+new Date().toTimeString().slice(0,5));setTimeout(()=>{if(!pending.length)status()},4000)}
  finally{flushing=false}}
addEventListener('online',()=>flush());
addEventListener('beforeunload',e=>{if(pending.length){e.preventDefault();e.returnValue=''}});
const padInv=n=>'INV-'+String(n).padStart(5,'0');
async function send(p){
  if(p.k==='inv'){const i=p.ref;if(i.date===TD||i.date===NTD){const t=todayISO(),off=i.due?Math.round((Date.parse(i.due)-Date.parse(i.date))/864e5):0;i.date=t;if(i.due)i.due=addD(t,Math.max(0,off||0))}(i.pays||[]).forEach(x=>{x.d=fixD(x.d)});
    const body=rest(i,['wsNew']);const n=await rpc('ws_save_invoice',{p:body,p_no:i.wsNew?null:num(i.n,'INV-')});
    if(i.wsNew){const old=i.n,nn=padInv(n);delete i.wsNew;
      if(nn!==old){i.n=nn;JOBS.forEach(j=>{if(j.n===old)j.n=nn});QUOTES.forEach(q=>{if(q.inv===old)q.inv=nn});
        if((location.hash||'').startsWith('#/invoice/'+old)){history.replaceState(null,'','#/invoice/'+nn);go()}}
      toast('Saved as '+nn)}
    const c=watch('inv',i);shadow.set(keyOf(c),J(i));return}
  if(p.k==='quote'){const q=p.ref;
    if(q.wsNew){const n=await rpc('ws_next_no',{kind:'quote'});const old=q.id,nn='Q-'+String(n).padStart(4,'0');delete q.wsNew;
      if(nn!==old){q.id=nn;JOBS.forEach(j=>{if(j.auth==='Accepted quote '+old)j.auth='Accepted quote '+nn;if(j.req==='From quote '+old)j.req='From quote '+nn});if(qfor===old)qfor=nn;
        if((location.hash||'').startsWith('#/quote/'+old)){history.replaceState(null,'','#/quote/'+nn);go()}}}
    if(q.d===TD||q.d===NTD){q.d=todayISO();q.valid=addD(q.d,30)}
    await upsert('quotes','no',[{no:num(q.id,'Q-'),cust:num(q.c,'c'),reg:q.r||null,date:q.d||null,valid:q.valid||null,status:q.st||'draft',became_invoice:num(q.inv,'INV-'),title:q.t||'',
      total:(typeof qTot==='function'?qTot(q):null),lines:q.lines||[],opts:q.opts||[],hist:q.hist||[],advise:q.adv||[],note:q.note||'',inote:q.inote||'',
      app:rest(q,['id','c','r','d','valid','st','inv','t','lines','opts','hist','adv','note','inote','fresh','wsNew'])}]);
    const c=watch('quote',q);shadow.set(keyOf(c),J(q));return}
  if(p.k==='job'){const j=p.ref;let isNew=false;
    if(j.wsNew){const n=await rpc('ws_next_no',{kind:'jobsheet'});const old=j.id,nn='JS-'+n;delete j.wsNew;isNew=true;
      if(nn!==old){j.id=nn;invoices.forEach(i=>{if(i.js===old)i.js=nn});QUOTES.forEach(q=>{if(q.js===old)q.js=nn});
        if((location.hash||'').startsWith('#/job/'+old)){history.replaceState(null,'','#/job/'+nn);go()}}}
    const row={no:num(j.id,'JS-'),reg:j.r||null,cust:num(j.c,'c'),title:j.t||'',description:j.req||'',work_done:j.found||'',advise:j.adv||[],status:j.st||'est',hold:j.hold||'',lines:j.lines||[],
      invoice:invoices.some(i=>i.n===j.n&&!i.wsNew)?num(j.n,'INV-'):null,app:rest(j,['id','r','c','t','req','found','adv','st','hold','lines','n','fresh','wsNew'])};
    if(isNew)row.date=todayISO();
    await upsert('jobsheets','no',[row]);const c=watch('job',j);shadow.set(keyOf(c),J(j));return}
  if(p.k==='veh'){const reg=p.reg;if(!VX[reg])return;await upsert('vehicles','reg',[{reg,app:VX[reg]}]);const c=watch('veh',VX[reg],{reg});shadow.set(keyOf(c),J(VX[reg]));return}
  if(p.k==='bk'){let d=null,b=null;Object.keys(BK).some(k=>{const x=(BK[k]||[]).find(y=>y.id===p.id);if(x){d=k;b=x;return true}});
    if(!b||p.del){await api('bookings?id=eq.'+encodeURIComponent(p.id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:{deleted:true}});return}
    await upsert('bookings','id',[{id:p.id,day:d,data:rest(b,['id']),deleted:false}]);return}
  if(p.k==='note'){await upsert('day_notes','day',[{day:p.day,notes:NOTES[p.day]||[]}]);return}}

const go0=go;go=function(){try{return go0.apply(this,arguments)}finally{if(live){try{checkAll();current()}catch(e){console.warn('ws: sync check',e.message)}}}};
const wrap=(name,fn)=>{const o=window[name];if(typeof o!=='function')return;window[name]=function(){if(!live)return o.apply(this,arguments);return fn(o,this,arguments)}};
const newInvoice=(o,t,a)=>{const top=invoices[0];const r=o.apply(t,a);if(invoices[0]&&invoices[0]!==top){const i=invoices[0];i.wsNew=true;touch('inv',i);const j=JOBS.find(x=>x.id===i.js);if(j)touch('job',j);const q=QUOTES.find(x=>x.id===i.q);if(q)touch('quote',q)}return r};
['makeInv','newInv','quoteToInv'].forEach(n=>wrap(n,newInvoice));
const byN=(o,t,a)=>{const r=o.apply(t,a);const i=invoices.find(x=>x.n===a[0]);if(i)touch('inv',i);return r};
['hold','addPay','pySeen'].forEach(n=>wrap(n,byN));
// "Mark paid" in the demo records no payment; the server works out paid from payment rows, so add one
wrap('pay',(o,t,a)=>{const r=o.apply(t,a);const i=invoices.find(x=>x.n===a[0]);if(i){i.pays=i.pays||[];const got=i.pays.reduce((s,x)=>s+(+x.a||0),0);if(i.status==='paid'&&i.paid-got>0.004)i.pays.push({d:todayISO(),m:'Marked paid',a:Math.round((i.paid-got)*100)/100,who:(me&&me.who)||ME});touch('inv',i)}return r});
wrap('pyPost',(o,t,a)=>{const n=pyOpen;const r=o.apply(t,a);const i=invoices.find(x=>x.n===n);if(i)touch('inv',i);return r});
wrap('invSave',(o,t,a)=>{const n=invEd&&invEd.n;const r=o.apply(t,a);const i=invoices.find(x=>x.n===n);if(i)touch('inv',i);return r});
wrap('qset',(o,t,a)=>{const q=S._q,fresh=q&&q.fresh,nj=JOBS.length;const r=o.apply(t,a);
  if(q&&fresh&&!q.fresh&&QUOTES.includes(q)){q.wsNew=true;touch('quote',q)}else if(q&&QUOTES.includes(q))touch('quote',q);
  if(JOBS.length>nj){JOBS[0].wsNew=true;touch('job',JOBS[0])}return r});
wrap('jstage',(o,t,a)=>{const nj=JOBS.length;const r=o.apply(t,a);if(JOBS.length>nj){JOBS[0].wsNew=true;touch('job',JOBS[0])}else{const j=JOBS.find(x=>x.id===a[0]);if(j)touch('job',j)}return r});
['jwho','jauth','jadv'].forEach(n=>wrap(n,(o,t,a)=>{const r=o.apply(t,a);const j=JOBS.find(x=>x.id===a[0]);if(j)touch('job',j);return r}));
['vxSet','vnote'].forEach(n=>wrap(n,(o,t,a)=>{const r=o.apply(t,a);if(VX[a[0]])touch('veh',VX[a[0]],{reg:a[0]});return r}));
['saveBk','delBk','cfSet','cfCycle','ptCycle','wlMoveHere','addNote','editNote'].forEach(n=>wrap(n,(o,t,a)=>{try{return o.apply(t,a)}finally{try{checkAll()}catch(e){}}}));

<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {

// Backup dot in the sidebar footer (round 43, design round 15): green when the last backup is under a day old, amber when older, red when it failed. Demo values; the real app reads them from the backup log.
(() => {
  const a = document.getElementById('bkfoot'); if (!a) return;
  const BK = { at: '2026-11-10T18:00', ok: true, copies: 3 };
  const age = (TODAY - new Date(BK.at)) / 36e5;
  const dot = a.querySelector('.dot'); dot.className = 'dot' + (!BK.ok ? ' bad' : age > 24 ? ' old' : '');

})();
// Version stamp in the sidebar footer: the build actually loaded on this device (the service worker's cache id, or sw.js when nothing is cached yet).
(async () => {
  const el = document.getElementById('verstamp'); if (!el) return;
  const show = v => { el.textContent = 'Build ' + v.replace(/^workshop-/, ''); };
  try { const keys = 'caches' in window ? await caches.keys() : []; const k = keys.find(x => /^workshop-v/.test(x)); if (k) return show(k); } catch (e) {}
  try { const t = await (await fetch('sw.js', { cache: 'no-store' })).text(); const m = t.match(/workshop-v\d+/); if (m) return show(m[0]); } catch (e) {}
  show('unknown');
})();
