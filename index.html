<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workshop · Wents Service Station</title>
<meta name="description" content="Clickable mock of the new garage system: lookup, diary, quotes, invoices, suppliers, reminders. Demo data only.">
<meta name="theme-color" content="#173E70">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workshop">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Saira:wght@800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#121316; --surface:#1C1D21; --sunk:#25272C; --fg:#ECEDEF; --muted:#A6A9B0; --line:#303238; --line-strong:#464950;
  --band:#173E70; --band-fg:#FFFFFF; --band-muted:#C6D5EB; --band-line:#2F5D96;
  --accent:#6AA6F0; --accent-fg:#0B1424; --ring:#CFE2FB; --warn:#F2B705;
  --flag-bg:#3A2F0E; --flag-line:#9C7A12; --flag-fg:#F5D77A;
  --tile:#2A2C32; --tile-hover:#34373E;
  --green:#5CB85C; --green-fg:#06220B; --red:#E5484D; --orange:#F28C28;
  --plate:#F5D000; --plate-fg:#111; --plate-band:#1F3E9B;
  --font-display:'Archivo',system-ui,-apple-system,sans-serif;
  --font-title:'Saira','Archivo',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-display);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:
 radial-gradient(900px 500px at 85% -10%, rgba(92,184,92,.10), transparent 60%),
 radial-gradient(700px 500px at -10% 110%, rgba(229,72,77,.08), transparent 60%);z-index:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:800}
.app{position:relative;z-index:1;display:grid;grid-template-columns:232px 1fr;min-height:100dvh}
.app>*,.two>*{min-width:0}
body{overflow-x:hidden}

/* sidebar */
.side{position:sticky;top:0;height:100dvh;padding:22px 14px;border-right:1px solid var(--line);background:rgba(18,19,22,.9);display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand .mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--font-title);font-size:20px}
.brand b{display:block;font-family:var(--font-title);font-size:17px;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 10px;border-radius:10px;color:var(--muted);font-weight:600;font-size:14px}
.nav a svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{background:var(--tile);color:var(--fg)}
.nav a.on{background:var(--tile);color:var(--fg)}
.nav a.on svg{color:var(--green)}
.nav .count{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px}
.side .foot{margin-top:auto;padding:12px 10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.side .foot .dot{display:inline-block;width:8px;height:8px;border-radius:99px;background:var(--green);margin-right:6px;box-shadow:0 0 0 3px rgba(92,184,92,.2)}

/* main */
.main{min-width:0;padding:26px 28px 90px;max-width:1180px;width:100%}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.title{font-family:var(--font-title);font-size:34px;line-height:1.05;letter-spacing:-.01em;margin:2px 0 20px}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head .actions{display:flex;gap:8px;flex-wrap:wrap}
.sec{font-size:18px;font-weight:800;margin:26px 0 12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.card.pad0{padding:0;overflow:hidden}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:block;transition:background .15s,border-color .15s}
.tile:hover{background:var(--tile-hover);border-color:var(--line-strong)}
.tile .ic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;margin-bottom:28px;background:var(--tile)}
.tile .ic svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile b{display:block;font-size:19px;font-weight:800;margin-bottom:2px}
.tile span{color:var(--muted)}
.ic.yel{background:var(--flag-bg);color:var(--flag-fg)} .ic.red{background:#3A1416;color:#F08A8E} .ic.blu{background:#17304F;color:var(--accent)} .ic.grn{background:#153A1C;color:#7ED37E} .ic.org{background:#3B250D;color:#F6B26B}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.stat b{display:block;font-family:var(--font-mono);font-size:30px;font-weight:600;line-height:1}
.stat span{color:var(--muted);font-size:14px}
.stat.y b{color:var(--warn)} .stat.b b{color:var(--accent)} .stat.r b{color:#F26469} .stat.g b{color:#7ED37E}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:12px;font-weight:700;background:var(--tile);border:1px solid var(--line);white-space:nowrap}
.btn:hover{background:var(--tile-hover)}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.pri{background:var(--green);color:var(--green-fg);border-color:transparent;box-shadow:0 0 0 4px rgba(92,184,92,.15)}
.btn.pri:hover{background:#68c468}
.btn.yel{background:var(--warn);color:#1a1400;border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.wide{width:100%;justify-content:center;padding:15px;font-size:17px;border-radius:14px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12.5px;font-weight:700;background:var(--tile);color:var(--muted)}
.pill.y{background:var(--flag-bg);color:var(--flag-fg)} .pill.g{background:#153A1C;color:#7ED37E} .pill.r{background:#3A1416;color:#F08A8E} .pill.b{background:#17304F;color:var(--accent)} .pill.o{background:#3B250D;color:#F6B26B}
.pill i{width:7px;height:7px;border-radius:99px;background:currentColor;font-style:normal}
.plate{display:inline-flex;align-items:stretch;border-radius:6px;overflow:hidden;font-family:var(--font-title);font-weight:800;letter-spacing:.04em;font-size:17px;line-height:1;font-style:italic;background:var(--plate);color:var(--plate-fg)}
.plate::before{content:"UK";display:grid;place-items:center;background:var(--plate-band);color:#fff;font-size:8px;padding:0 5px;font-style:normal;letter-spacing:0}
.plate span{padding:7px 10px 6px 8px;white-space:nowrap}
.plate.lg{font-size:26px} .plate.lg span{padding:10px 14px 8px 10px} .plate.lg::before{font-size:10px;padding:0 7px}
.plate.sm{font-size:13px} .plate.sm span{padding:5px 7px 4px 6px}
.mono{font-family:var(--font-mono);font-weight:500}
.muted{color:var(--muted)}
.small{font-size:13px}
.list{display:flex;flex-direction:column}
.list .it{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--line);transition:background .12s}
.list .it:first-child{border-top:0}
.list a.it:hover{background:var(--tile)}
.list .it .t{flex:1;min-width:0}
.list .it .t b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .it .t span{color:var(--muted);font-size:13px}
.list .it .amt{font-family:var(--font-mono);font-weight:600;font-size:16px}
.chev{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
.av{width:38px;height:38px;border-radius:99px;display:grid;place-items:center;font-weight:800;flex:none;background:var(--tile)}
.av.dan{background:#CFE2FB;color:#0B1424} .av.lee{background:#F28C28;color:#1a0c00} .av.jen{background:var(--green);color:var(--green-fg)}
.search{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line-strong);border-radius:18px;padding:6px 8px 6px 18px}
.search svg{width:24px;height:24px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
.search input{flex:1;background:none;border:0;outline:0;font-size:20px;padding:12px 0;min-width:0}
.search input::placeholder{color:#6c7079}
.search .btn{padding:12px 18px}
.search:focus-within{box-shadow:0 0 0 4px rgba(106,166,240,.18);border-color:var(--accent)}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600} .bk .mid.link{cursor:pointer}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field input,.field select,.field textarea{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:0;font-size:16px}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(106,166,240,.18)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:10px 14px;padding:4px 0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;text-align:right}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{padding:9px 16px;border-radius:99px;background:var(--tile);color:var(--muted);font-weight:700;border:1px solid transparent}
.tabs button.on{background:var(--fg);color:var(--bg)}
.table{width:100%;border-collapse:collapse}
.table th{text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 16px;border-bottom:1px solid var(--line)}
.table td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table tr.link{cursor:pointer} .table tr.link:hover td{background:var(--tile)}
.table .r{text-align:right}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;opacity:0;transition:.25s;z-index:50;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translateX(-50%)}
.demo{position:fixed;right:-2px;top:46%;background:var(--warn);color:#1a1400;font-weight:800;font-size:12px;letter-spacing:.2em;writing-mode:vertical-rl;padding:16px 8px;border-radius:10px 0 0 10px;z-index:40}

/* diary */
.week{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.week button{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;color:var(--muted)}
.week button b{display:block;font-family:var(--font-mono);font-size:24px;color:var(--fg);font-weight:600;margin:2px 0}
.week button.on{background:var(--warn);color:#4a3a00;border-color:transparent} .week button.on b{color:#1a1400}
.bays{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.bay h3{font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 4px 10px}
.job{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px 18px;margin-bottom:10px;display:block;overflow:hidden}
.job::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--who)}
.job .time{font-family:var(--font-mono);font-size:13px;color:var(--muted)}
.job .time b{color:var(--fg);font-weight:600;font-style:italic}
.job h4{margin:8px 0 2px;font-size:17px}
.job p{margin:0;color:var(--muted);font-size:13.5px}
.job .ft{display:flex;align-items:center;justify-content:space-between;margin-top:12px;color:var(--muted);font-size:13px}
.job:hover{background:var(--tile)}
.slot{border:1px dashed var(--line-strong);border-radius:14px;padding:12px;text-align:center;color:var(--muted);font-size:13px;margin-bottom:10px}
.slot:hover{border-color:var(--accent);color:var(--accent)}

/* quote editor */
.line{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.line .lh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.line .lh b{font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.line .lh b.lab{color:var(--accent)} .line .lh b.prt{color:var(--flag-fg)} .line .lh b.mot{color:#7ED37E}
.line .x{width:30px;height:30px;border-radius:9px;background:var(--tile);display:grid;place-items:center;color:var(--muted)}
.line input{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:0;font-size:15px;width:100%}
.line .nums{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;margin-top:8px;align-items:end}
.line .nums label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.line .tot{font-family:var(--font-mono);font-weight:600;font-size:17px;font-style:italic;padding-bottom:10px;min-width:80px;text-align:right}
.totals{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.totals div{display:flex;justify-content:space-between;padding:6px 0;font-size:15px}
.totals div span:last-child{font-family:var(--font-mono);font-style:italic;font-weight:600}
.totals .grand{border-top:1px solid var(--line-strong);margin-top:6px;padding-top:12px;font-size:20px;font-weight:800}
.two{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}

/* invoice paper */
.paper{background:#fff;color:#111;border-radius:16px;padding:28px 30px;font-size:14px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.paper .ph{display:flex;justify-content:space-between;gap:16px;border-bottom:3px solid #111;padding-bottom:16px}
.paper .logo{width:52px;height:52px;border-radius:99px;background:#2F6DC8;color:#fff;display:grid;place-items:center;font-family:var(--font-title);font-size:26px}
.paper .ph b{font-size:17px}
.paper .ph .inv{text-align:right;font-weight:800;font-size:22px;letter-spacing:.02em}
.paper .ph .inv i{display:block;font-size:14px;font-weight:700}
.paper .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#666;font-weight:700}
.paper .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:16px 0;border-bottom:1px solid #ddd}
.paper .meta b{display:block;font-size:15px}
.paper table{width:100%;border-collapse:collapse;margin-top:14px}
.paper th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#666;text-align:left;padding:8px 0;border-bottom:2px solid #111}
.paper td{padding:10px 0;border-bottom:1px solid #e5e5e5;vertical-align:top}
.paper td.r,.paper th.r{text-align:right;white-space:nowrap}
.paper td small{display:block;color:#777;font-size:12px}
.paper .grp td{padding:14px 0 4px;border:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:#2F6DC8}
.paper .sum{margin:14px 0 0 auto;width:min(100%,300px)}
.paper .sum div{display:flex;justify-content:space-between;padding:5px 0}
.paper .sum div span:last-child{font-style:italic;font-weight:700}
.paper .sum .g{border-top:2px solid #111;margin-top:6px;padding-top:10px;font-size:18px;font-weight:800}
.paper .note{background:#F3F4F6;border-radius:10px;padding:12px 14px;margin-top:16px}
.paper .bank{border:2px dashed #ccc;border-radius:10px;padding:12px 14px;margin-top:12px}
.paper .fine{text-align:center;color:#777;font-size:12px;margin-top:16px}
.paper .plate{font-size:14px} .paper .plate span{padding:5px 8px 4px 6px}
.stamp{position:absolute;right:28px;top:120px;border:4px solid #2e9b4a;color:#2e9b4a;font-family:var(--font-title);font-size:34px;padding:4px 14px;border-radius:10px;transform:rotate(-12deg);opacity:.9}

/* mobile tab bar */
.tabbar{display:none}
.topbar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:18px 16px 110px}
  .title{font-size:28px}
  .g3,.g4{grid-template-columns:repeat(2,1fr)}
  .two{grid-template-columns:1fr}
  .bays{grid-template-columns:1fr}
  .week{grid-template-columns:repeat(6,1fr)}
  .week button b{font-size:20px}
  .search input{font-size:17px}
  .search .btn span{display:none}
  .kv{grid-template-columns:90px 1fr}
  .paper{padding:20px 18px}
  .paper .meta{grid-template-columns:1fr 1fr}
  .line .nums{grid-template-columns:1fr 1fr 1fr}
  .line .tot{grid-column:1/-1;text-align:right;padding:4px 0 0}
  .hide-m{display:none !important}
  .list .it{flex-wrap:wrap;row-gap:6px}
  .list .it .t{flex:1 1 100%;order:9}
  .list .it .t b{white-space:normal}
  .list .it .pill{margin-left:auto}
  .list .it .chev{display:none}
  .week button{padding:10px 2px;font-size:11px;white-space:nowrap}
  .paper .ph{flex-wrap:wrap}
  .paper .ph .inv{text-align:left}
  .head .actions .btn{padding:9px 12px;font-size:14px}
  .eyebrow{letter-spacing:.08em}
  .table th:nth-child(3),.table td:nth-child(3){display:none}
  .cantbl th:nth-child(3),.cantbl td:nth-child(3){display:table-cell}
  .edln{display:grid;grid-template-columns:46px 1fr 1fr 36px;flex-wrap:wrap} .edln .in.d{grid-column:2/4;min-width:0} .edln .in.q,.edln .in.p{width:auto!important;min-width:0} .edln .btn{grid-column:4;grid-row:1/3;align-self:center;justify-self:end}
  .cantbl th,.cantbl td{padding:10px 8px;font-size:13px} .cantbl th:first-child,.cantbl td:first-child{padding-left:14px} .cantbl .pill{padding:3px 7px;font-size:11px}
  .tabbar{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;align-items:flex-end;background:rgba(28,29,33,.92);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:28px;padding:10px 6px 8px;z-index:30}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:11px;font-weight:600;width:60px;position:relative}
  .tabbar a svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tabbar a.on{color:var(--green)}
  .tabbar a.mid{margin-top:-34px}
  .tabbar a.mid i{width:64px;height:64px;border-radius:99px;background:var(--green);color:var(--green-fg);display:grid;place-items:center;border:5px solid var(--bg);box-shadow:0 0 0 2px rgba(92,184,92,.35),0 0 30px rgba(92,184,92,.35)}
  .tabbar a.mid i svg{width:28px;height:28px;stroke:var(--green-fg)}
  .tabbar .count{position:absolute;top:-6px;right:8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:1px 6px}
  .demo{top:auto;bottom:140px}
}
@media (max-width:480px){ .g2,.g3,.g4{grid-template-columns:1fr 1fr} .stats4{grid-template-columns:1fr 1fr} }
.back{width:40px;height:40px;border-radius:12px;background:var(--tile);display:grid;place-items:center;margin-bottom:10px}
.back svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4}
.hist{position:relative;padding-left:22px}
.hist::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--line-strong)}
.hist .h{position:relative;padding:4px 0 18px}
.hist .h::before{content:"";position:absolute;left:-20px;top:9px;width:10px;height:10px;border-radius:99px;background:var(--accent);box-shadow:0 0 0 3px var(--bg)}
.hist .h.old::before{background:var(--line-strong)}
.hist .h b{display:block}

  const cs=customers.filter(c=>digits?String(cx(c.id).ref).includes(q)||c.phone.replace(/\s/g,'').includes(q):(crLabel(c)+c.name).toLowerCase().replace(/\s/g,'').includes(q)).filter(c=>digits||vehicles.filter(v=>v.cust===c.id).length>1);
  const vs=vehicles.filter(v=>v.reg.replace(/\s/g,'').toLowerCase().includes(q)||cust(v.cust).name.toLowerCase().replace(/\s/g,'').includes(q)||crCo(cust(v.cust)).toLowerCase().replace(/\s/g,'').includes(q)||cust(v.cust).phone.replace(/\s/g,'').includes(q)||cust(v.cust).addr.toLowerCase().replace(/\s/g,'').includes(q));

  const vrow=v=>{const c=cust(v.cust);return `<a class="it" href="#/vehicle/${enc(v.reg)}">${plate(v.reg)}<div class="t"><b>${v.make}</b><span>${crRef(v.cust,1)} ${crLabel(c)} · ${c.phone}</span></div>${I.chev}</a>`};
  box.innerHTML=`<div class="sec">Results</div><div class="card pad0 list">${cs.map(crow).join('')}${vs.map(vrow).join('')}${is.map(i=>`<a class="it" href="#/invoice/${i.n}"><span class="ic">${I.inv}</span><div class="t"><b>${i.n} · ${i.title}</b><span>${cust(i.cust).name} · ${fmtS(i.date)}</span></div><span class="amt">${gbp(i.total)}</span>${I.chev}</a>`).join('')}${!vs.length&&!is.length&&!cs.length?'<div class="it muted">Nothing found. Try part of a reg, a surname or the customer\'s reference number.</div>':''}</div>`;return false};

 return `<a class="back" href="#/health">${I.back}</a>

let sugItems=[],sugIx=-1;
const sugN=x=>String(x||'').toLowerCase().replace(/\s+/g,'');
const sugHi=(txt,q)=>{const t=String(txt);const i=t.toLowerCase().replace(/\s+/g,'').indexOf(q);if(i<0||!q)return t;let a=0,b=0,n=0;for(let k=0;k<t.length;k++){if(/\s/.test(t[k]))continue;if(n===i)a=k;n++;if(n===i+q.length){b=k+1;break}}return b?t.slice(0,a)+'<mark>'+t.slice(a,b)+'</mark>'+t.slice(b):t};
window.sugFind=raw=>{const q=sugN(raw);if(q.length<2)return[];const out=[];const digits=/^\d+$/.test(q);
  customers.forEach(c=>{const x=cx(c.id);const co=crCo(c);const hay=[c.name,co,x.ref,c.phone,c.addr];let hit=-1;
    if(digits){if(String(x.ref)===q)hit=0;else if(String(x.ref).startsWith(q))hit=1;else if(sugN(c.phone).includes(q))hit=2}
    else{const nm=sugN(c.name),cn=sugN(co);const sur=sugN(c.name.replace(/^(mr|mrs|ms|miss|dr)\s+/i,''));if(sur.startsWith(q)||cn.startsWith(q))hit=0;else if(nm.includes(q)||cn.includes(q))hit=1;else if(sugN(c.addr).includes(q))hit=3}
    if(hit>=0){const vs=vehicles.filter(v=>v.cust===c.id);out.push({k:'c',rank:hit,c,vs,href:'#/customer/'+c.id})}});
  vehicles.forEach(v=>{const r=sugN(v.reg);let hit=-1;if(!digits&&r.startsWith(q))hit=0;else if(r.includes(q))hit=1;else if(sugN(v.make).includes(q))hit=2;
    if(hit>=0)out.push({k:'v',rank:hit,v,c:cust(v.cust),href:'#/vehicle/'+enc(v.reg)})});
  invoices.forEach(i=>{if(sugN(i.n).includes(q))out.push({k:'i',rank:2,i,href:'#/invoice/'+i.n})});
  return out.sort((a,b)=>a.rank-b.rank||(a.k==='c'?-1:1)).slice(0,8)};
window.sugGo=raw=>{const box=document.getElementById('sug'),inp=document.getElementById('q');if(!box)return;const q=sugN(raw);sugItems=sugFind(raw);sugIx=-1;
  if(!sugItems.length){box.innerHTML=q.length>=2?`<div class="sg none">Nothing matches <b>${raw.trim()}</b> yet · press Enter to search everything, or <a href="#/customers" onclick="toast('New customer form')">add a new customer</a></div>`:'';box.classList.toggle('on',q.length>=2);inp.setAttribute('aria-expanded',q.length>=2);return}
  box.innerHTML=sugItems.map((s,ix)=>{if(s.k==='c'){const x=cx(s.c.id),co=crCo(s.c);return `<a class="sg" role="option" href="${s.href}" onmousedown="event.preventDefault()" onclick="sugPick(${ix})"><span class="av">${I.users}</span><div class="t"><b>${sugHi(s.c.name,q)}${co?` <span class="crco">${sugHi(co,q)}</span>`:''}<span class="ref">${sugHi(x.ref,q)}</span></b><span>${sugHi(s.c.phone,q)} · ${s.vs.length?s.vs.length>2?s.vs.length+' vehicles · '+s.vs[0].reg+' +'+(s.vs.length-1):s.vs.map(v=>sugHi(v.reg,q)).join(', '):'no vehicle'}${x.acct==='Account'?' · Trade':''}</span></div><span class="kind">Customer</span></a>`}
    if(s.k==='v')return `<a class="sg" role="option" href="${s.href}" onmousedown="event.preventDefault()" onclick="sugPick(${ix})">${plate(s.v.reg)}<div class="t"><b>${sugHi(s.v.make,q)}</b><span>${sugHi(s.c.name,q)}${crCo(s.c)?' · '+crCo(s.c):''} · ${s.c.phone}</span></div><span class="kind">Vehicle</span></a>`;
    return `<a class="sg" role="option" href="${s.href}" onmousedown="event.preventDefault()" onclick="sugPick(${ix})"><span class="ic">${I.inv}</span><div class="t"><b>${sugHi(s.i.n,q)} · ${s.i.title}</b><span>${cust(s.i.cust).name} · ${fmtS(s.i.date)} · ${gbp(s.i.total)}</span></div><span class="kind">Invoice</span></a>`}).join('')+`<div class="sg foot">↑↓ to choose · Enter to open · <b>${sugItems.length}</b> shown · press Search for all</div>`;
  box.classList.add('on');inp.setAttribute('aria-expanded','true')};
window.sugClose=()=>{const box=document.getElementById('sug');if(box){box.classList.remove('on');box.innerHTML=''}const inp=document.getElementById('q');inp&&inp.setAttribute('aria-expanded','false');sugIx=-1};

 const ch=[];const od=i.lines.map(l=>l.d),nd=invEd.lines.map(l=>l.d);nd.filter(d=>!od.includes(d)).forEach(d=>ch.push('added '+(d||'a line')));od.filter(d=>!nd.includes(d)).forEach(d=>ch.push('took off '+d));

 if(sent)vs.push({v:vs.length+1,who:'Jenson',when:now5(),what:(why?why+' · ':'')+(ch.join(', ')||'no line changes')+(before!==after?' · '+gbp(before)+' → '+gbp(after):'')});
 i.lines=invEd.lines;i.note=invEd.note;i.total=after;if(i.paid>i.total)i.paid=i.total;invEd=null;toast(sent?'Saved as version '+vs.length+' · '+i.n+' keeps its number':i.n+' updated · still a draft');go()};
const invEditor=i=>{const vs=invVers(i);const sent=invSent(i);return `<div class="card" style="margin-bottom:14px;border-color:var(--accent)"><div class="row" style="justify-content:space-between;margin-bottom:10px;gap:10px"><div><b>Editing ${i.n}</b><div class="small muted">${sent?`Saving makes version ${vs.length+1}. Version ${vs.length} stays on file and the number doesn’t change.`:'Still a draft, so no new version yet.'}</div></div><span class="pill b">v${vs.length}${sent?' → v'+(vs.length+1):''}</span></div>
 ${invEd.lines.map((l,idx)=>`<div class="row edln" style="gap:8px;margin-bottom:8px;align-items:center;flex-wrap:nowrap"><span class="pill" style="min-width:46px;justify-content:center">${{job:'Job',prt:'Part',lab:'Lab',mot:'MOT'}[l.k]||'Line'}</span><input class="in d" style="flex:1;min-width:90px" value="${esc(l.d)}" placeholder="Description" oninput="invLn(${idx},'d',this.value)">${l.k==='job'?'':`<input class="in q" type="number" step="0.1" style="width:62px;padding:10px 8px" value="${l.q}" oninput="invLn(${idx},'q',this.value)"><input class="in p" type="number" step="0.01" style="width:84px;padding:10px 8px" value="${l.p}" oninput="invLn(${idx},'p',this.value)">`}<button class="btn sm ghost" style="padding:8px" onclick="invDel(${idx})">${I.x}</button></div>`).join('')}
 <div class="row" style="margin:4px 0 12px"><button class="btn sm" onclick="invAdd('prt')">${I.plus}Part</button><button class="btn sm" onclick="invAdd('lab')">${I.plus}Labour</button><span style="margin-left:auto;white-space:nowrap"><span class="muted small">Total inc VAT </span><b class="mono" id="edtot">${gbp(money(invEd.lines).total)}</b></span></div>
 <label class="field"><span>Note on the invoice</span><input value="${esc(invEd.note)}" oninput="invEd.note=this.value"></label>
 ${sent?`<label class="field"><span>What changed and why · goes in the versions list</span><input id="why" placeholder="e.g. Took off the wiper blades, customer declined them"></label>`:''}
 <div class="row"><button class="btn pri" onclick="invSave()">${I.check}${sent?'Save as version '+(vs.length+1):'Save'}</button><button class="btn ghost" onclick="invCancel()">Cancel</button></div></div>`};
const invVersCard=(i,x)=>{const vs=invVers(i);return `<div class="card" style="margin-top:12px"><div class="row" style="justify-content:space-between;margin-bottom:8px"><div class="eyebrow">Versions</div><span class="pill ${vs.length>1?'b':''}">v${vs.length}${vs.length>1?' · '+(vs.length-1)+' edit'+(vs.length>2?'s':''):''}</span></div>
 ${[...vs].reverse().map(v=>`<div class="qtl"><span>${v.when}</span><div><b>Version ${v.v}</b> · ${v.who}<div class="small muted">${esc(v.what)}</div></div></div>`).join('')}
 ${invSent(i)?`<div class="qtl"><span>${fmtS(i.date)} 16:42</span><div>Sent by ${(x.via||'text').toLowerCase()}${x.mob?' to '+x.mob:''}</div></div>`:''}${(i.pays||[]).map(p=>`<div class="qtl"><span>${fmtS(p.d)}</span><div>${gbp(p.a)} paid by ${p.m.toLowerCase()}</div></div>`).join('')}
 ${i.q?`<a class="btn sm ghost" style="margin-top:10px" href="#/quote/${i.q}">${I.pound}From quote ${i.q}</a>`:''}</div>`};
const isSvcInv=i=>/service/i.test(i.title||'')||(i.lines||[]).some(l=>l.k==='job'&&/service/i.test(l.d));
const svcCard=i=>{if(!isSvcInv(i)||!i.reg)return '';const on=!!i.svcNext;const due=addM(i.date,SETUP.svc.months),mi=(i.miles||0)+SETUP.svc.miles;return `<div class="card" style="margin-top:12px"><div class="sw ${on?'on':''}" style="border:0;padding:0" onclick="svcDone('${i.n}')"><div><b>Service done · set next reminder</b><small>${on?'Set for '+fmtS(i.svcNext.due)+' or '+i.svcNext.miles.toLocaleString()+' miles · in Reminders and on the vehicle page':'Next one '+fmtS(due)+' or '+mi.toLocaleString()+' miles · '+SETUP.svc.months+' months / '+SETUP.svc.miles.toLocaleString()+' miles'}</small></div><i></i></div>${on?`<div class="row" style="margin-top:12px"><a class="btn sm ghost" href="#/reminders">${I.bell}Reminders</a><a class="btn sm ghost" href="#/vehicle/${enc(i.reg)}">${I.car}Vehicle</a></div>`:''}</div>`};
window.svcDone=n=>{const i=invoices.find(x=>x.n===n);const id='s'+i.reg.replace(' ','');let r=REMS.find(x=>x.id===id);
 if(i.svcNext){Object.assign(r,i.svcPrev);delete i.svcNext;delete i.svcPrev;toast('Reminder taken back off');go();return}
 const due=addM(i.date,SETUP.svc.months),miles=(i.miles||0)+SETUP.svc.miles;
 if(!r){r={id,reg:i.reg,type:'svc',st:'new',log:[]};REMS.push(r)}i.svcPrev={due:r.due,last:r.last,st:r.st,miles:r.miles,inv:r.inv,log:[...r.log]};
 Object.assign(r,{due,last:i.date,st:'new',miles,inv:n});r.log.push(['11 Nov','Service done on '+n+' · next reminder '+fmtS(due)+' or '+miles.toLocaleString()+' mi']);i.svcNext={due,miles};toast('Service reminder set · '+fmtS(due)+' or '+miles.toLocaleString()+' miles');go()};

function go(){
  const h=(location.hash||'#/home').slice(2);const [path]=h.split('?');const [r,...rest]=path.split('/');const arg=decodeURIComponent(rest.join('/'));
  if(r!=='quote'&&r!=='job'){qlines=null;qfor=null;qopts=null}
  const fn=S[r]||S.home;
  const m=document.getElementById('main');m.innerHTML=fn(arg);m.className='main sec-'+secOf(r);
  if(!['home','more'].includes(r)){const t=m.querySelector('.title');if(t&&!t.querySelector('.secmark'))t.insertAdjacentHTML('afterbegin',`<i class="secmark">${ART[secOf(r)]}</i>`)}
  drawNav(r);
  if(r==='home')document.getElementById('q')?.focus();
}
addEventListener('hashchange',()=>{go();scrollTo(0,0)});
go();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
